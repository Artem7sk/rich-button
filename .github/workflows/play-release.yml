name: PaidFlow Play bundle
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: node --test tests/core.test.cjs
      - name: Prepare upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.PAIDFLOW_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.PAIDFLOW_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PAIDFLOW_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PAIDFLOW_UPLOAD_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/paidflow-upload.jks"
      - name: Build signed Android App Bundle
        env:
          PAIDFLOW_UPLOAD_KEYSTORE_PATH: ${{ runner.temp }}/paidflow-upload.jks
          PAIDFLOW_UPLOAD_STORE_PASSWORD: ${{ secrets.PAIDFLOW_UPLOAD_STORE_PASSWORD }}
          PAIDFLOW_UPLOAD_KEY_ALIAS: ${{ secrets.PAIDFLOW_UPLOAD_KEY_ALIAS }}
          PAIDFLOW_UPLOAD_KEY_PASSWORD: ${{ secrets.PAIDFLOW_UPLOAD_KEY_PASSWORD }}
        run: ./gradlew --no-daemon bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: PaidFlow-Play-AAB
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
